<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>SAP FID 下載</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    margin: 0;
    padding: 16px;
    background: #f5f5f5;
    color: #222;
  }
  h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 12px;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  input {
    flex: 1;
    padding: 6px 8px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  button {
    padding: 6px 14px;
    font-size: 14px;
    cursor: pointer;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #2a6f4b;
    color: white;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #log {
    background: #111;
    color: #ddd;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px;
    padding: 8px;
    height: 260px;
    overflow-y: auto;
    white-space: pre-wrap;
    border-radius: 4px;
  }
  #result {
    margin-top: 10px;
    font-size: 13px;
    display: none;
  }
  #result button {
    margin-left: 8px;
    background: #444;
  }
</style>
</head>
<body>
  <h1>輸入 FID,下載該機台的 Tool BOM</h1>
  <div class="row">
    <input id="fid" placeholder="例如 264059" autofocus />
    <button id="downloadBtn">下載</button>
  </div>
  <div id="log"></div>
  <div id="result">
    完成:<span id="resultPath"></span>
    <button id="openFolderBtn">開啟所在資料夾</button>
  </div>
  <script src="fid-downloader-renderer.js"></script>
</body>
</html>
