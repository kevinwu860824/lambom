<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOM Compare</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>BOM 比對工具</h1>
    <p>從多份機台 BOM 中選擇兩份進行差異比對。</p>

    <section class="controls">
      <div class="control-group">
        <label>
          機台 A
          <select id="machineA"></select>
        </label>
        <label>
          子項 A
          <select id="subpartA"></select>
        </label>
      </div>
      <div class="control-group">
        <label>
          機台 B
          <select id="machineB"></select>
        </label>
        <label>
          子項 B
          <select id="subpartB"></select>
        </label>
      </div>
      <button id="compareBtn">開始比對</button>
    </section>

    <section id="summary" class="summary"></section>

    <section class="results-grid">
      <article>
        <h2>僅存在於 A</h2>
        <div id="onlyA" class="result-table"></div>
      </article>
      <article>
        <h2>僅存在於 B</h2>
        <div id="onlyB" class="result-table"></div>
      </article>
      <article>
        <h2>共同項目</h2>
        <div id="common" class="result-table"></div>
      </article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
